# web/ 의 페이지를 GitHub Pages 로 내보낸다.
# GitHub 이 주는 정적 사이트용 workflow(actions/starter-workflows 의 pages/static.yml)를 바탕으로,
# 올리는 폴더를 web/ 으로 바꾸고 web/ 이 바뀐 push 에서만 돌게 했다. action 은 모두 Node 24 로 도는 판이다.
# 저장소의 다른 파일(진행 정리, 프롬프트, 수업 노트북, 데이터)은 올라가지 않는다.
name: Publish the web page

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v5
