<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>카라마조프 가의 형제들: 인물과 어휘의 네트워크</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,.10); --wash: rgba(11,11,11,.045);
  --c-alyosha: #2a78d6; --c-mitya: #eb6834; --c-kolya: #1baf7a; --c-fyodor: #6b6a66; --c-none: #c3c2b7;
  --pos-noun: #6250d6; --pos-verb: #eda100; --pos-adj: #e87ba4;
  --edge: #898781;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,.10); --wash: rgba(255,255,255,.06);
    --c-alyosha: #3987e5; --c-mitya: #d95926; --c-kolya: #199e70; --c-fyodor: #a3a29b; --c-none: #52514e;
    --pos-noun: #9085e9; --pos-verb: #c98500; --pos-adj: #d55181;
    --edge: #898781;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,.10); --wash: rgba(255,255,255,.06);
  --c-alyosha: #3987e5; --c-mitya: #d95926; --c-kolya: #199e70; --c-fyodor: #a3a29b; --c-none: #52514e;
  --pos-noun: #9085e9; --pos-verb: #c98500; --pos-adj: #d55181;
  --edge: #898781;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--page); color: var(--ink);
  font: 15px/1.55 system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  -webkit-font-smoothing: antialiased;
}
.app { max-width: 1480px; margin: 0 auto; padding: 22px 22px 28px; }
header h1 { font-size: 26px; line-height: 1.25; font-weight: 700; margin: 0 0 4px; letter-spacing: -.01em; }
header .lede { margin: 0 0 14px; color: var(--ink2); max-width: 74ch; }
.filters { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; margin-bottom: 12px; }
.filters label { display: inline-flex; align-items: center; gap: 7px; color: var(--ink2); font-size: 13.5px; }
.filters select, .filters input[type=number] {
  font: inherit; font-size: 13.5px; color: var(--ink); background: var(--surface);
  border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px;
}
.filters input[type=number] { width: 58px; }
.filters input[type=range] { width: 170px; accent-color: var(--ink2); }
.filters .book-name { min-width: 15ch; color: var(--ink); font-size: 13.5px; }
.filters .check { gap: 6px; }
.filters .spacer { flex: 1 1 auto; }
.filters [disabled], .filters .off { opacity: .45; }
main { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 14px; align-items: start; }
.stage {
  position: relative; background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  height: min(80vh, 800px); min-height: 500px; overflow: hidden;
}
#net { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; -webkit-user-select: none; user-select: none; }
#net.panning, #net.panning .node { cursor: grabbing; }
#net text { font-family: inherit; fill: var(--ink); pointer-events: none; paint-order: stroke; stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round; }
#net text.minor { fill: var(--ink2); }
#net .edge { fill: none; stroke-linecap: round; transition: opacity .12s; }
#net .node { cursor: pointer; }
#net .node .mark { stroke: var(--surface); stroke-width: 2px; transition: opacity .12s; }
#net .node.embedded .mark { fill: var(--surface) !important; stroke-width: 2.6px; }
#net .node:focus { outline: none; }
#net .node:focus-visible .halo, #net .node.sel .halo { stroke: var(--ink); stroke-width: 1.6px; fill: none; opacity: 1; }
#net .halo { opacity: 0; fill: none; }
#net .dim .mark, #net text.dim { opacity: .16; }
#net .edge.dim { opacity: .035 !important; }
#net .absent .mark { opacity: .22; }
.zoom { position: absolute; right: 10px; top: 10px; display: flex; gap: 4px; }
.zoom button, .seg button, .linkish {
  font: inherit; font-size: 13px; color: var(--ink2); background: var(--surface); border: 1px solid var(--border);
  border-radius: 6px; padding: 3px 9px; cursor: pointer;
}
.zoom button:hover, .seg button:hover, .linkish:hover { background: var(--wash); }
.zoom button:disabled { opacity: .45; cursor: default; background: var(--surface); }
.legend {
  position: absolute; left: 12px; top: 10px; font-size: 12.5px; color: var(--ink2); line-height: 1.5;
  background: color-mix(in srgb, var(--surface) 86%, transparent); padding: 6px 9px; border-radius: 8px; max-width: 236px;
}
.legend .row { display: flex; align-items: center; gap: 7px; }
.legend .note { margin-top: 3px; color: var(--muted); }
.sw { display: inline-block; width: 11px; height: 11px; border-radius: 50%; flex: 0 0 auto; }
.sw.sq { border-radius: 2px; }
.sw.ring { background: transparent !important; border: 2.5px solid var(--ink2); }
#tip {
  position: absolute; pointer-events: none; z-index: 5; background: var(--surface); color: var(--ink);
  border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; font-size: 12.5px; line-height: 1.45;
  box-shadow: 0 4px 14px rgba(0,0,0,.14); max-width: 260px; display: none;
}
#tip b { font-size: 13.5px; }
#tip .sub { color: var(--ink2); }
aside {
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px 16px 14px;
  max-height: min(80vh, 800px); min-height: 500px; overflow: auto;
}
aside h2 { font-size: 20px; margin: 0; line-height: 1.3; }
aside .alt { color: var(--ink2); font-size: 13.5px; }
aside h3 { font-size: 13.5px; font-weight: 600; margin: 18px 0 6px; color: var(--ink); }
aside p { margin: 6px 0; color: var(--ink2); font-size: 13.5px; }
aside .comm { display: flex; align-items: center; gap: 7px; font-size: 13.5px; color: var(--ink2); margin-top: 6px; }
.tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 12px; }
.tile { border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; }
.tile .v { font-size: 20px; font-weight: 600; line-height: 1.2; }
.tile .l { font-size: 12px; color: var(--ink2); }
.nb { display: grid; grid-template-columns: minmax(0, 176px) 1fr; gap: 3px 8px; align-items: center; font-size: 13px; }
.nb button { all: unset; cursor: pointer; display: flex; align-items: center; gap: 6px; color: var(--ink); min-width: 0; border-radius: 4px; }
.nb button .nm { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; min-width: 0; }
.nb button:hover { text-decoration: underline; }
.nb button:focus-visible, .linkish:focus-visible, .seg button:focus-visible, .zoom button:focus-visible, tr:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.nb .bar { display: flex; align-items: center; gap: 6px; color: var(--ink2); font-variant-numeric: tabular-nums; }
.nb .bar i { display: block; height: 10px; border-radius: 0 4px 4px 0; min-width: 2px; }
.seg { display: inline-flex; gap: 4px; flex-wrap: wrap; }
.seg button[aria-pressed=true] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.wn text { font-size: 11.5px; fill: var(--ink); }
.wn text.head { font-size: 11.5px; fill: var(--ink2); font-weight: 600; }
.wn path { fill: none; stroke: var(--axis); }
.wn circle, .wn rect { stroke: var(--surface); stroke-width: 1.5px; }
.wlist { display: grid; gap: 8px 12px; font-size: 12.5px; color: var(--ink2); }
.wlist div b { display: block; color: var(--ink); font-weight: 600; margin-bottom: 2px; }
.wlist span { white-space: nowrap; }
.wlegend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--ink2); margin: 4px 0 6px; }
.wlegend span { display: inline-flex; align-items: center; gap: 5px; }
.tablewrap { position: absolute; inset: 0; overflow: auto; background: var(--surface); padding: 12px 14px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
th { color: var(--ink2); font-weight: 600; position: sticky; top: -12px; background: var(--surface); }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
tbody tr { cursor: pointer; }
tbody tr:hover { background: var(--wash); }
footer { margin-top: 12px; color: var(--muted); font-size: 12.5px; max-width: 110ch; }
ul.plain { margin: 6px 0; padding-left: 18px; color: var(--ink2); font-size: 13.5px; }
ul.plain li { margin: 3px 0; }
@media (max-width: 980px) {
  main { grid-template-columns: 1fr; }
  aside { max-height: none; min-height: 0; }
  .stage { height: auto; min-height: 0; }
  #net { height: 78vw; min-height: 300px; max-height: 70vh; }
  .legend { position: static; max-width: none; background: none; padding: 4px 12px 10px; }
}
@media (prefers-reduced-motion: reduce) { #net .edge, #net .node .mark { transition: none; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>카라마조프 가의 형제들: 누가 누구 곁에 나오고 어떤 말이 붙는가</h1>
    <p class="lede" id="lede"></p>
    <div class="filters" role="group" aria-label="보기 설정">
      <label>함께 나온 단위
        <select id="f-unit">
          <option value="sentence">같은 문장</option>
          <option value="paragraph" selected>같은 문단</option>
          <option value="chapter">같은 장</option>
        </select>
      </label>
      <label>범위
        <input type="range" id="f-book" min="0" max="13" step="1" value="0" aria-describedby="f-book-name">
        <span class="book-name" id="f-book-name">소설 전체</span>
      </label>
      <label>최소 횟수 <input type="number" id="f-min" min="1" max="30" value="2"></label>
      <label>이름 표기
        <select id="f-lang"><option value="ko" selected>한글</option><option value="en">English</option></select>
      </label>
      <span class="spacer"></span>
      <label class="check"><input type="checkbox" id="f-base"> 수업 코드 그대로 돌린 결과</label>
      <label class="check"><input type="checkbox" id="f-table"> 표로 보기</label>
    </div>
  </header>
  <main>
    <section class="stage" aria-label="인물 네트워크">
      <svg id="net" role="group" aria-label="인물 공출현 네트워크"></svg>
      <div class="zoom"><button id="z-in" aria-label="확대">+</button><button id="z-out" aria-label="축소">−</button><button id="z-fit">전체 보기</button><button id="z-reset" disabled>배치 되돌리기</button></div>
      <div class="legend" id="legend"></div>
      <div id="tip" role="status"></div>
      <div class="tablewrap" id="tablewrap" hidden></div>
    </section>
    <aside id="panel" aria-live="polite"></aside>
  </main>
  <footer id="foot"></footer>
</div>
<script>
let D = /*__DATA__*/;      // 한 파일로 만들 때는 여기에 데이터가 들어가고, 나눠 올릴 때는 null 이 들어가 data.json 을 읽는다

const SVGNS = "http://www.w3.org/2000/svg";
const $ = (s, r = document) => r.querySelector(s);
function svg(tag, attrs, parent) {
  const e = document.createElementNS(SVGNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const k in (props || {})) {
    if (k === "class") e.className = props[k];
    else if (k === "text") e.textContent = props[k];
    else if (k.slice(0, 2) === "on") e.addEventListener(k.slice(2), props[k]);
    else if (k === "style") e.style.cssText = props[k];
    else e.setAttribute(k, props[k]);
  }
  for (const kid of kids) if (kid != null) e.append(kid);
  return e;
}
const fmt = n => Number(n).toLocaleString("ko-KR");
const SLOTS = ["alyosha", "mitya", "kolya", "fyodor"];
const UNIT_LABEL = { sentence: "같은 문장", paragraph: "같은 문단", chapter: "같은 장" };
const BASE_CAT = { name: ["이름", "alyosha"], fragment: ["부칭이나 성의 조각", "mitya"], other: ["사람이 아닌 낱말", "kolya"] };

const S = { unit: "paragraph", book: 0, minW: 2, lang: "ko", base: false, table: false, sel: null, method: "key", wlist: false };
const V = { k: 1, tx: 0, ty: 0, w: 800, h: 600, fitK: 1 };      // 화면 변환
let idIndex = {};
const meas = document.createElement("canvas").getContext("2d");

function nodeLabel(n) { return S.base ? n.id : (S.lang === "ko" ? n.ko : n.name); }
function bookName(b) {
  if (!b) return "소설 전체";
  const bk = D.meta.books[b - 1];
  return b === 13 ? "에필로그" : b + "권 " + bk.title;
}

/* ---- 현재 설정에서의 그래프 ---- */
function graph() {
  if (S.base) {
    const nodes = D.baseline.nodes, edges = D.baseline.edges;
    return decorate(nodes, edges, n => BASE_CAT[n.cat][1], () => true);
  }
  const src = S.book ? ((D.edgesByBook[S.unit] || {})[S.book] || []) : D.edges[S.unit];
  const edges = src.filter(e => e[2] >= S.minW);
  return decorate(D.nodes, edges, n => (n.u[S.unit] || {}).c || null, n => !S.book || n.byBook[S.book - 1] > 0);
}
function decorate(nodes, edges, slotOf, presentOf) {
  const str = new Array(nodes.length).fill(0), deg = new Array(nodes.length).fill(0), adj = nodes.map(() => []);
  let maxW = 1;
  for (const [a, b, w] of edges) { str[a] += w; str[b] += w; deg[a]++; deg[b]++; adj[a].push([b, w]); adj[b].push([a, w]); if (w > maxW) maxW = w; }
  const maxS = Math.max(1, ...str);
  return { nodes, edges, str, deg, adj, maxW, maxS, slot: nodes.map(slotOf), present: nodes.map(presentOf) };
}

/* ---- 그리기 ---- */
const net = $("#net");
let G = null, drawn = null;
function fit() {
  const r = net.getBoundingClientRect();
  V.w = r.width; V.h = r.height;
  V.fitK = Math.min(V.w / D.meta.width, V.h / D.meta.height);
  V.k = V.fitK; V.tx = (V.w - D.meta.width * V.k) / 2; V.ty = (V.h - D.meta.height * V.k) / 2;
}
const px = n => [n.x * V.k + V.tx, n.y * V.k + V.ty];
const baseR = i => G.str[i] > 0 ? 4.5 + 19 * Math.sqrt(G.str[i] / G.maxS) : 3.4;
function radius(i) {
  const z = Math.pow(V.k / V.fitK, 0.35) * Math.max(0.8, Math.min(1.15, V.fitK / 0.62));
  return baseR(i) * z;
}
function fontSize(i) {
  const z = Math.pow(V.k / V.fitK, 0.25);
  return (10.5 + 9.5 * Math.sqrt(G.str[i] / G.maxS)) * z;
}
function colorVar(slot) { return slot ? "var(--c-" + slot + ")" : "var(--c-none)"; }

function render() {
  G = graph();
  if (!G.nodes.opened) openLayout();
  net.setAttribute("viewBox", "0 0 " + V.w + " " + V.h);
  net.replaceChildren();
  const gE = svg("g", {}, net), gN = svg("g", {}, net), gL = svg("g", {}, net);
  const P = G.nodes.map(px), R = G.nodes.map((_, i) => radius(i));
  const focus = grab && grab.moved ? grab.i : S.sel != null ? S.sel : null;      // 끄는 동안에는 끌리는 인물의 선을 보여 준다
  const near = focus != null ? new Set([focus, ...G.adj[focus].map(a => a[0])]) : null;

  // 엣지: 가는 것부터 그려 굵은 것이 위에 오게
  const order = G.edges.map((e, i) => i).sort((a, b) => G.edges[a][2] - G.edges[b][2]);
  const edgeEls = [];
  for (const ei of order) {
    const [a, b, w] = G.edges[ei];
    const [x1, y1] = P[a], [x2, y2] = P[b];
    const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy) || 1;
    const bend = ((a + b) % 2 ? 1 : -1) * 0.10 * len;
    const cx = (x1 + x2) / 2 - dy / len * bend, cy = (y1 + y2) / 2 + dx / len * bend;
    const same = G.slot[a] && G.slot[a] === G.slot[b];
    const t = Math.sqrt(w / G.maxW);
    const el = svg("path", {
      class: "edge" + (near && !(a === focus || b === focus) ? " dim" : ""),
      d: `M${x1.toFixed(1)},${y1.toFixed(1)}Q${cx.toFixed(1)},${cy.toFixed(1)} ${x2.toFixed(1)},${y2.toFixed(1)}`,
      stroke: same ? colorVar(G.slot[a]) : "var(--edge)", "stroke-width": (0.6 + 6.2 * t).toFixed(2),
      opacity: (near && (a === focus || b === focus) ? 0.42 + 0.5 * t : 0.13 + 0.5 * t).toFixed(2),
    }, gE);
    edgeEls.push([a, b, el]);
  }

  // 노드
  const nodeEls = [];
  G.nodes.forEach((n, i) => {
    const [x, y] = P[i], r = R[i];
    const absent = !G.present[i] && G.str[i] === 0;
    if (absent && S.book) return void nodeEls.push(null);
    const g = svg("g", {
      class: "node" + (n.kind === "embedded" ? " embedded" : "") + (S.sel === i ? " sel" : "") + (near && !near.has(i) ? " dim" : "") + (G.str[i] === 0 ? " absent" : ""),
      tabindex: 0, role: "button", "aria-label": nodeLabel(n) + ", 함께 나온 인물 " + G.deg[i] + "명", "data-i": i,
    }, gN);
    const col = colorVar(G.slot[i]);
    svg("circle", { class: "halo", cx: x, cy: y, r: r + 4.5 }, g);
    if (G.slot[i] === "fyodor" && !S.base) svg("rect", { class: "mark", x: x - r * .9, y: y - r * .9, width: r * 1.8, height: r * 1.8, rx: 2.5, fill: col, stroke: n.kind === "embedded" ? col : null }, g);
    else {
      const c = svg("circle", { class: "mark", cx: x, cy: y, r, fill: col }, g);
      if (n.kind === "embedded") c.style.stroke = col;
    }
    if (n.kind === "embedded" && G.slot[i] === "fyodor") g.querySelector(".mark").style.stroke = col;
    svg("circle", { cx: x, cy: y, r: Math.max(r, 13), fill: "transparent" }, g);
    g.addEventListener("pointerenter", ev => { hover(i, ev); });
    g.addEventListener("pointermove", ev => moveTip(ev));
    g.addEventListener("pointerleave", () => { hover(null); });
    g.addEventListener("focus", () => hover(i, null));
    g.addEventListener("blur", () => hover(null));
    g.addEventListener("click", ev => { ev.stopPropagation(); if (performance.now() - lastUp > 500) select(i); });      // 포인터로 누른 것은 pointerup 에서 이미 골랐다
    g.addEventListener("keydown", ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); select(i); } });
    nodeEls.push(g);
  });

  // 이름표: 중요한 인물부터 놓고, 자리가 없으면 숨긴다 (가리키면 보인다)
  const rank = G.nodes.map((_, i) => i).filter(i => nodeEls[i]).sort((a, b) => (focus != null ? ((b === focus) - (a === focus)) || (near.has(b) - near.has(a)) : 0) || G.str[b] - G.str[a]);
  const boxes = G.nodes.map((_, i) => nodeEls[i] ? [P[i][0] - R[i] - 1, P[i][1] - R[i] - 1, P[i][0] + R[i] + 1, P[i][1] + R[i] + 1, i] : null).filter(Boolean);
  const placed = [], labelEls = new Array(G.nodes.length).fill(null), lab = new Array(G.nodes.length).fill(null);
  const live = SIM.alpha > 0 && drawn && drawn.lab.length === G.nodes.length ? drawn.lab : null;      // 자리를 잡는 동안에는 앞 장의 이름표 자리를 본다
  const nearTop = focus != null ? new Set(G.adj[focus].slice().sort((a, b) => b[1] - a[1]).slice(0, 8).map(a => a[0])) : null;
  const ov = (a, b) => Math.max(0, Math.min(a[2], b[2]) - Math.max(a[0], b[0])) * Math.max(0, Math.min(a[3], b[3]) - Math.max(a[1], b[1]));
  rank.forEach((i, order) => {
    const n = G.nodes[i], fs = fontSize(i), bold = G.str[i] > G.maxS * 0.12, label = nodeLabel(n);
    meas.font = (bold ? "700 " : "400 ") + fs + "px system-ui, sans-serif";

  A.append(h("p", { text: "수업에서 쓴 BookNetworkAnalyzer를 그대로 이 소설에 돌린 결과입니다. 대문자로 시작하는 고유명사 " + fmt(b.candidates) + "개를 등장인물 후보로 뽑았고, 그 가운데 연결이 많은 " + b.nodes.length + "개가 남았습니다." }));
  const groups = { name: [], fragment: [], other: [] };
  b.nodes.forEach(n => groups[n.cat].push(n.id));
  for (const c of ["other", "fragment", "name"]) {
    A.append(h("h3", {}, h("span", { class: "sw", style: "background:var(--c-" + BASE_CAT[c][1] + ");margin-right:6px" }), BASE_CAT[c][0] + " " + groups[c].length + "개"));
    A.append(h("p", { text: groups[c].sort().join(", ") }));
  }
  A.append(h("h3", { text: "왜 이렇게 되나" }));
  const ul = h("ul", { class: "plain" });
  ul.append(h("li", { text: "러시아 이름은 이름, 부칭, 애칭이 따로 쓰입니다. Alyosha와 Alexey, Mitya와 Dmitri가 다른 사람으로 잡히고, Fyodorovitch 하나에 네 사람이 섞입니다." }));
  ul.append(h("li", { text: "문장 첫머리의 You, They나 대심문관 장의 Thou, Thy처럼 대문자로 쓰인 대명사가 인물로 들어옵니다." }));
  ul.append(h("li", { text: "이름 뒤에 공백이 올 때만 세기 때문에 쉼표나 마침표 앞의 이름은 빠집니다. Alyosha는 절반쯤만 세어집니다." }));
  A.append(ul);
  A.append(h("p", { text: "체크를 풀면 별칭표를 적용한 결과로 돌아갑니다." }));
}

/* ---- 표로 보기 ---- */
function renderTable() {
  const T = $("#tablewrap");
  T.hidden = !S.table;
  if (!S.table) return;
  T.replaceChildren();
  const tb = h("tbody");
  const rows = G.nodes.map((n, i) => i).sort((a, b) => G.str[b] - G.str[a] || G.deg[b] - G.deg[a]);
  const head = S.base ? ["낱말", "갈래", "함께 나온 낱말 수", "횟수 합"] : ["인물", "묶음", "불린 횟수", "함께 나온 인물", "횟수 합", "PageRank", "매개 중심성"];
  for (const i of rows) {
    const n = G.nodes[i];
    let cells;
    if (S.base) cells = [n.id, BASE_CAT[n.cat][0], G.deg[i], G.str[i]];
    else {
      const u = n.u[S.unit] || {};
      const c = D.communities[S.unit].find(c => c.slot === u.c);
      cells = [nodeLabel(n) + " (" + (S.lang === "ko" ? n.name : n.ko) + ")", c ? nodeLabel(D.nodes[idIndex[c.top]]) + " 쪽" : "없음",
        S.book ? n.byBook[S.book - 1] : n.mentions, G.deg[i], G.str[i], u.pr != null ? u.pr.toFixed(3) : "", u.btw != null ? u.btw.toFixed(3) : ""];
    }
    const tr = h("tr", { tabindex: 0 });
    cells.forEach((c, k) => tr.append(h("td", { class: k >= 2 ? "n" : "", text: typeof c === "number" ? fmt(c) : String(c) })));
    if (!S.base) { tr.addEventListener("click", () => select(i)); tr.addEventListener("keydown", ev => { if (ev.key === "Enter") select(i); }); }
    if (S.sel === i) tr.style.background = "var(--wash)";
    tb.append(tr);
  }
  const thead = h("thead", {}, h("tr", {}, ...head.map((t, k) => h("th", { class: k >= 2 ? "n" : "", text: t }))));
  T.append(h("table", {}, thead, tb));
  if (!S.base) T.append(h("p", { style: "color:var(--muted);font-size:12.5px", text: "PageRank와 매개 중심성은 소설 전체, " + UNIT_LABEL[S.unit] + " 기준으로 미리 계산한 값입니다. 나머지 열은 지금 설정을 따릅니다." }));
}

/* ---- 조작 ---- */
function syncControls() {
  $("#f-unit").value = S.unit; $("#f-book").value = S.book; $("#f-min").value = S.minW; $("#f-lang").value = S.lang;
  $("#f-book-name").textContent = bookName(S.book);
  const noBook = S.unit === "chapter";
  for (const id of ["f-unit", "f-book", "f-min", "f-lang"]) $("#" + id).disabled = S.base || (id === "f-book" && noBook);
  $("#f-book").closest("label").classList.toggle("off", S.base || noBook);
}
function update() { grab = null; simStop(); syncControls(); render(); renderPanel(); renderTable(); }
$("#f-unit").addEventListener("change", e => { S.unit = e.target.value; if (S.unit === "chapter") S.book = 0; update(); });
$("#f-book").addEventListener("input", e => { S.book = +e.target.value; update(); });
$("#f-min").addEventListener("change", e => { S.minW = Math.max(1, Math.min(30, +e.target.value || 1)); update(); });
$("#f-lang").addEventListener("change", e => { S.lang = e.target.value; update(); });
$("#f-base").addEventListener("change", e => { S.base = e.target.checked; S.sel = null; update(); });
$("#f-table").addEventListener("change", e => { S.table = e.target.checked; update(); });

function zoomAt(f, mx, my) {
  const k2 = Math.max(V.fitK * 0.7, Math.min(V.fitK * 6, V.k * f));
  V.tx = mx - (mx - V.tx) * (k2 / V.k); V.ty = my - (my - V.ty) * (k2 / V.k); V.k = k2;
  schedule();
}
let raf = 0;
function schedule() { if (!raf) raf = requestAnimationFrame(() => { raf = 0; render(); }); }
net.addEventListener("wheel", ev => { ev.preventDefault(); const r = net.getBoundingClientRect(); zoomAt(ev.deltaY < 0 ? 1.15 : 1 / 1.15, ev.clientX - r.left, ev.clientY - r.top); }, { passive: false });
let drag = null, grab = null, pid = null, lastUp = 0;      // drag: 배경을 끌어 화면을 옮기는 중, grab: 인물을 누르거나 끄는 중, pid: 그 포인터
const dataXY = ev => { const r = net.getBoundingClientRect(); return [(ev.clientX - r.left - V.tx) / V.k, (ev.clientY - r.top - V.ty) / V.k]; };
net.addEventListener("pointerdown", ev => {
  if (ev.button || (pid != null && ev.pointerId !== pid)) return;      // 한 번에 포인터 하나, 주 단추만
  if (pid != null) endPointer({ pointerId: pid, type: "pointercancel" });      // 같은 포인터가 또 눌렸다면 떼는 것을 놓친 것이다
  pid = ev.pointerId;
  net.setPointerCapture(pid);
  const g = ev.target.closest(".node");
  if (g) {
    const i = +g.dataset.i, [x, y] = dataXY(ev);
    grab = { i, sx: ev.clientX, sy: ev.clientY, ox: G.nodes[i].x - x, oy: G.nodes[i].y - y, slop: ev.pointerType === "mouse" ? 4 : 10, moved: false };
    return;
  }
  drag = { x: ev.clientX, y: ev.clientY, tx: V.tx, ty: V.ty, moved: false }; net.classList.add("panning");
});
net.addEventListener("pointermove", ev => {
  if (ev.pointerId !== pid) return;
  if (grab) {
    if (!grab.moved) {      // 이만큼 움직여야 끌기로 본다. 그 전에 떼면 고르기다
      if (Math.abs(ev.clientX - grab.sx) + Math.abs(ev.clientY - grab.sy) <= grab.slop) return;
      grab.moved = true; tip.style.display = "none"; net.classList.add("panning"); simStart(grab.i);
    }
    const n = G.nodes[grab.i], [x, y] = dataXY(ev);
    n.x = x + grab.ox; n.y = y + grab.oy;
    if (stillOnly.matches) { for (let k = 0; k < 4; k++) tick(); schedule(); }
  } else if (drag) {
    const dx = ev.clientX - drag.x, dy = ev.clientY - drag.y;
    if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true;
    V.tx = drag.tx + dx; V.ty = drag.ty + dy; schedule();
  }
});
function endPointer(ev) {
  if (ev.pointerId !== pid) return;
  pid = null; lastUp = performance.now();
  const up = ev.type === "pointerup";
  if (grab) {
    const g = grab;
    grab = null;
    if (!g.moved) { if (up) select(g.i); }
    else if (stillOnly.matches) { SIM.target = 0; while (SIM.alpha > 0.003) tick(); simStop(); render(); }
    else SIM.target = 0;      // 놓으면 식으면서 멈춘다
  } else if (up && drag && !drag.moved && S.sel != null) { S.sel = null; render(); renderPanel(); renderTable(); }
  drag = null; net.classList.remove("panning");
}
for (const type of ["pointerup", "pointercancel", "lostpointercapture"]) net.addEventListener(type, endPointer);

/* ---- 자리 잡기 ----
   layout.csv 의 자리는 처음 열 때의 배치일 뿐이다. 인물을 끌면 선으로 이어진 이웃이 따라오고 겹친 원은 비켜난다.
   놓은 인물은 그 자리에 남는다. 단위나 범위를 바꿀 때는 아무것도 움직이지 않는다. */
const SIM = { alpha: 0, target: 0, raf: 0, fixed: -1, home: null };
const stillOnly = matchMedia("(prefers-reduced-motion: reduce)");      // 움직임을 줄이라는 설정이면 놓는 순간 바로 끝낸다
const shown = i => !(S.book && !G.present[i] && G.str[i] === 0);

function collide(passes) {      // 겹친 원을 밀어낸다. 반지름을 데이터 좌표로 고정해서 화면 크기나 확대에 따라 결과가 달라지지 않는다
  const N = G.nodes, R = N.map((_, i) => baseR(i) / 0.62);
  let hit = false;
  for (let p = 0; p < passes; p++) {
    for (let i = 0; i < N.length; i++) {
      if (!shown(i)) continue;
      for (let j = i + 1; j < N.length; j++) {
        if (!shown(j)) continue;
        const a = N[i], b = N[j], need = R[i] + R[j] + 3;
        let dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy);
        if (d >= need) continue;
        hit = true;
        if (d < 1e-6) { dx = 1; dy = (i + j) % 2 ? 1 : -1; d = Math.SQRT2; }
        const push = (need - d) / d, wa = i === SIM.fixed ? 0 : j === SIM.fixed ? 1 : 0.5;      // 끌리는 인물은 밀리지 않는다
        a.x -= dx * push * wa; a.y -= dy * push * wa;
        b.x += dx * push * (1 - wa); b.y += dy * push * (1 - wa);
      }
    }
  }
  return hit;
}
function openLayout() {      // 처음 그릴 때 한 번: 겹친 원만 떼어 놓고 그 자리를 처음 배치로 기억한다
  for (let k = 0; k < 80 && collide(1); k++);
  for (const n of G.nodes) { n.x0 = n.x; n.y0 = n.y; n.vx = n.vy = 0; }
  G.nodes.opened = true;
}
function tick() {
  const N = G.nodes, H = SIM.home, a = SIM.alpha;
  for (let i = 0; i < N.length; i++) {      // 끌기 전의 자리로 돌아가려는 힘
    N[i].vx += (H[i][0] - N[i].x) * 0.12 * a; N[i].vy += (H[i][1] - N[i].y) * 0.12 * a;
  }
  for (const [s, t] of G.edges) {      // 선으로 이어진 둘은 끌기 전의 거리를 지키려 한다. 상대가 많은 쪽이 덜 움직인다
    const A = N[s], B = N[t];
    let dx = B.x + B.vx - A.x - A.vx, dy = B.y + B.vy - A.y - A.vy;
    const d = Math.hypot(dx, dy) || 1, rest = Math.hypot(H[t][0] - H[s][0], H[t][1] - H[s][1]);
    const f = (d - rest) / d * a / Math.min(G.deg[s], G.deg[t]), share = G.deg[s] / (G.deg[s] + G.deg[t]);
    dx *= f; dy *= f;
    B.vx -= dx * share; B.vy -= dy * share; A.vx += dx * (1 - share); A.vy += dy * (1 - share);
  }
  for (let i = 0; i < N.length; i++) {
    const n = N[i];
    if (i === SIM.fixed) { n.vx = n.vy = 0; continue; }
    n.x += n.vx *= 0.6; n.y += n.vy *= 0.6;
  }
  collide(2);
  SIM.alpha += (SIM.target - SIM.alpha) * 0.08;
}
function simStart(i) {      // 지금 자리를 기준으로 삼는다. 그래서 앞서 옮긴 것이 다음 끌기 때 되돌아가지 않는다
  SIM.home = G.nodes.map(n => [n.x, n.y]);
  SIM.fixed = i; SIM.alpha = SIM.target = 0.3;
  $("#z-reset").disabled = false;
  if (!stillOnly.matches && !SIM.raf) SIM.raf = requestAnimationFrame(simLoop);
}
function simLoop() {
  SIM.raf = 0;
  tick(); render();
  if (SIM.alpha > 0.003) SIM.raf = requestAnimationFrame(simLoop); else simStop();
}
function simStop() {
  if (SIM.raf) cancelAnimationFrame(SIM.raf);
  SIM.raf = 0; SIM.alpha = SIM.target = 0; SIM.fixed = -1;
  if (G) for (const n of G.nodes) n.vx = n.vy = 0;
}
$("#z-reset").addEventListener("click", () => {
  simStop();
  for (const n of [...D.nodes, ...D.baseline.nodes]) if (n.x0 != null) { n.x = n.x0; n.y = n.y0; }
  $("#z-reset").disabled = true; render();
});
$("#z-in").addEventListener("click", () => zoomAt(1.3, V.w / 2, V.h / 2));
$("#z-out").addEventListener("click", () => zoomAt(1 / 1.3, V.w / 2, V.h / 2));
$("#z-fit").addEventListener("click", () => { fit(); render(); });
addEventListener("resize", () => { if (D) { fit(); render(); } });

/* ---- 시작 ---- */
function start() {
  idIndex = Object.fromEntries(D.nodes.map((n, i) => [n.id, i]));
  S.minW = D.meta.min_weight;
  $("#lede").textContent = "Constance Garnett의 영역본(1912) " + fmt(D.meta.text.words) + "단어에서 인물 " + D.meta.characters + "명이 이름이나 호칭으로 불린 "
    + fmt(D.meta.mentions) + "곳을 찾고, 누가 누구와 함께 불리는지를 세어 이었습니다.";
  $("#foot").textContent = "본문은 Project Gutenberg 28054번(public domain)입니다. 이름은 손으로 만든 별칭표로 찾았고, 낱말의 품사와 사전형은 spaCy en_core_web_sm으로 구했습니다. "
    + "묶음은 Louvain 방법으로 찾았으며, 색 세 가지와 네모 하나로 나눈 것은 색을 구별하기 어려운 사람도 가를 수 있게 하기 위해서입니다.";
  fit(); update();
}
if (D) start();
else fetch("data.json").then(r => r.json()).then(rows => { D = Object.fromEntries(rows.map(r => [r.key, r.value])); start(); })
  .catch(() => { $("#lede").textContent = "데이터 파일(data.json)을 읽지 못했습니다. index.html과 같은 폴더에 있는지 확인해 주세요."; });
</script>
</body>
